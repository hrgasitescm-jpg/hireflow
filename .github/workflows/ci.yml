name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          SUPABASE_SERVICE_ROLE_KEY: placeholder
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

  # Test isolasi multi-tenant: membuktikan RLS benar-benar memisahkan data
  # antar-organisasi. Kalau ini gagal, JANGAN deploy.
  rls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL 16
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16
      - name: Run tenant isolation tests
        run: |
          # Test dijalankan sebagai user `postgres`, yang tidak bisa menelusuri
          # home directory runner. Membuka izin $GITHUB_WORKSPACE saja tidak cukup
          # karena direktori induknya tetap tertutup. Jadi salin ke /tmp dulu.
          #
          # Struktur salinan harus /tmp/rls-ci/supabase/... karena run.sh menghitung
          # ROOT sebagai dua level di atas dirinya, lalu mencari $ROOT/supabase/migrations.
          rm -rf /tmp/rls-ci && mkdir -p /tmp/rls-ci
          cp -r "$GITHUB_WORKSPACE/supabase" /tmp/rls-ci/
          chmod -R a+rX /tmp/rls-ci
          sudo -u postgres env \
            PGBIN=/usr/lib/postgresql/16/bin \
            TMPDIR=/tmp \
            bash /tmp/rls-ci/supabase/tests/run.sh
